name: Build and deploy to Vercel

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: vercel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '20'
  VITE_API_URL: 'https://api.pinturasdiamante.com'
  VITE_ENVIRONMENT: 'production'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify SEO output
        run: npm run build

      - name: Validate Vercel token and project access
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret $name is not configured"
              exit 1
            fi
          done

          token_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            https://api.vercel.com/v2/user)
          if [ "$token_status" != "200" ]; then
            echo "::error::Vercel rejected VERCEL_TOKEN (HTTP $token_status). Replace it with an active token from an account with access."
            exit 1
          fi

          project_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          if [ "$project_status" != "200" ]; then
            if [ "$project_status" = "404" ]; then
              echo "::error::Vercel authenticated the token, but cannot find this project in the specified team. Check VERCEL_ORG_ID and VERCEL_PROJECT_ID and confirm the account has team access."
            else
              echo "::error::Vercel authenticated the token, but denied access to the project (HTTP $project_status). Check the token account's team membership and project permissions."
            fi
            exit 1
          fi

          echo "Vercel token is valid and can access the configured project."

      - name: Deploy production to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.2.0 deploy --prod --yes --token "$VERCEL_TOKEN" --scope pinturasdiamante

      - name: Deploy preview to Vercel
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@65.2.0 deploy --yes --token "$VERCEL_TOKEN" --scope pinturasdiamante
