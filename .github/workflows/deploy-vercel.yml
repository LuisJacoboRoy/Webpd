name: Build and deploy to Vercel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VITE_API_URL: "https://api.pinturasdiamante.com"
  VITE_ENVIRONMENT: "production"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.pinturasdiamante.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy and assign production domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          deployment_url="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "Deployed: $deployment_url"
          vercel alias set "$deployment_url" www.pinturasdiamante.com --token="$VERCEL_TOKEN"
