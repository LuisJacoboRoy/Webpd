name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  VITE_API_URL: 'https://api.pinturasdiamante.com'
  VITE_ENVIRONMENT: 'production'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify static catalog
        run: npm run build

      - name: Preserve GitHub Pages custom domain
        run: |
          test "$(tr -d '\r\n' < CNAME)" = "pinturasdiamante.com"
          cp CNAME dist/CNAME
          test -f dist/CNAME
          echo "GitHub Pages custom domain: $(cat dist/CNAME)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the custom domain serves the current catalog
        env:
          SITE_URL: https://pinturasdiamante.com
        run: |
          set -euo pipefail
          page_file=$(mktemp)
          trap 'rm -f "$page_file"' EXIT

          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 10 \
            "$SITE_URL/catalogo/" --output "$page_file"

          if ! grep -q 'name="static-seo-route" content="/catalogo"' "$page_file"; then
            echo "::error::The custom domain did not serve the catalog from this GitHub Pages deployment."
            exit 1
          fi

          echo "Verified $SITE_URL/catalogo/ serves the catalog deployed by this workflow."
