name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: github-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          GITHUB_PAGES: "false"
        run: npm run build

      - name: Prepare custom domain and redirect pages
        env:
          VERCEL_PRODUCTION_URL: https://pinturas-web.vercel.app
        run: |
          test "$(tr -d '\r\n' < CNAME)" = "pinturasdiamante.com"
          cp CNAME dist/CNAME
          touch dist/.nojekyll
          node scripts/create-github-pages-redirects.js dist
          if grep -Fq '"/Webpd/' dist/index.html; then
            echo "Build output still uses the GitHub project path /Webpd/ on the custom domain."
            exit 1
          fi
          grep -Fq 'src="/assets/' dist/index.html
          grep -Fq 'facebook-domain-verification' dist/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
